name: Apply related equipment links

on:
  push:
    branches:
      - feat/product-crosslinks
    paths:
      - tools/apply_related_links.py
      - .github/workflows/apply-related-links.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden one-time updater
        run: |
          sed -i 's/if css.count(marker) != 1:/if marker not in css:/' tools/apply_related_links.py
          sed -i 's/css.replace(marker, rules + marker)/css.replace(marker, rules + marker, 1)/' tools/apply_related_links.py

      - name: Add related equipment links
        run: python3 tools/apply_related_links.py

      - name: Validate site
        run: |
          python3 tools/update_sitemap.py
          python3 tools/check_site.py
          python3 tools/check_site.py --publication
          git diff --check

      - name: Commit generated page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/products site/assets/site.css site/sitemap.xml
          git commit -m "Add related equipment links to product pages"
          git push origin HEAD:feat/product-crosslinks
